name: ci

on:
  pull_request:
    # `edited` re-runs the guard when the PR title or body changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The main ruleset requires this job by its name, `ci`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          # Release-asset digest of the linux.x86_64 tar.xz. Check it before installing.
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          printf '%s  %s\n' "$SHELLCHECK_SHA256" /tmp/shellcheck.tar.xz | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          got=$(shellcheck --version | awk '/^version:/ {print $2}')
          [ "$got" = "$SHELLCHECK_VERSION" ] || { echo "shellcheck $got, want $SHELLCHECK_VERSION"; exit 1; }
          git ls-files -z '*.sh' | xargs -0 -r shellcheck -x -S style

      - name: Merge-guard hook test
        run: bash tests/no-merge-guard.test.sh

      - name: Public-repo guard test
        run: |
          scripts/get-gitleaks.sh
          bash tests/check-public.test.sh

      - name: Public-repo guard
        env:
          # Without this secret the guard fails. The term list is never committed.
          YSTACK_BLOCKED_TERMS: ${{ secrets.YSTACK_BLOCKED_TERMS }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          status=0
          scripts/check-public.sh tree || status=1
          scripts/check-public.sh range "$BASE_SHA" "$HEAD_SHA" || status=1
          if [ "$EVENT_NAME" = pull_request ]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-text.txt"
            scripts/check-public.sh message "$RUNNER_TEMP/pr-text.txt" || status=1
          fi
          exit "$status"
