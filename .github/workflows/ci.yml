name: ci

on:
  pull_request:
    # `edited` re-runs the guard when the PR title or body changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs first, on its own runner, and runs no code from the PR. The scanner
  # comes from the base commit; the PR's commits are only read as Git objects.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Public-repo guard
        env:
          # Without this secret the guard fails. The term list is never committed.
          YSTACK_BLOCKED_TERMS: ${{ secrets.YSTACK_BLOCKED_TERMS }}
        run: |
          set -uo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH") || exit 2
            head=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH") || exit 2
          else
            base=$(jq -r .before "$GITHUB_EVENT_PATH") || exit 2
            head=$GITHUB_SHA
          fi
          trusted=$RUNNER_TEMP/trusted
          mkdir -p "$trusted"
          for f in check-public.sh get-gitleaks.sh; do
            git show "$base:scripts/$f" > "$trusted/$f" || {
              echo "The base commit has no trusted scanner."
              exit 2
            }
          done
          chmod +x "$trusted"/*.sh
          "$trusted/get-gitleaks.sh" > /dev/null || exit 2
          status=0
          # HEAD is the commit the later job checks out: the test merge for a PR.
          "$trusted/check-public.sh" tree || status=1
          "$trusted/check-public.sh" range "$base" "$head" || status=1
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            jq -r '.pull_request.title, "", (.pull_request.body // "")' "$GITHUB_EVENT_PATH" \
              > "$RUNNER_TEMP/pr-text.txt" || exit 2
            "$trusted/check-public.sh" message "$RUNNER_TEMP/pr-text.txt" || status=1
          fi
          exit "$status"

  # Runs code from the PR, and prints source lines, only after the guard passed.
  checks:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # One output per leg. The matrix result alone can be success when a leg was
    # cancelled before it ran, so the gate also needs both outputs.
    outputs:
      linux: ${{ steps.checks.outputs.linux }}
      macos: ${{ steps.checks.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI pins shellcheck for Linux only, so only that leg runs it.
      - name: Install shellcheck
        if: runner.os == 'Linux'
        env:
          SHELLCHECK_VERSION: "0.11.0"
          # Release-asset digest of the linux.x86_64 tar.xz. Check it before installing.
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          printf '%s  %s\n' "$SHELLCHECK_SHA256" /tmp/shellcheck.tar.xz | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Checks
        id: checks
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            scripts/check.sh --skip-tree
            echo "linux=success" >> "$GITHUB_OUTPUT"
          else
            scripts/check.sh --skip-tree --skip-shellcheck
            echo "macos=success" >> "$GITHUB_OUTPUT"
          fi

  # The main ruleset requires this job by its name, `ci`. A skipped job would
  # count as passing, so this one always runs and checks both results.
  ci:
    needs: [guard, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          GUARD: ${{ needs.guard.result }}
          CHECKS: ${{ needs.checks.result }}
          LINUX: ${{ needs.checks.outputs.linux }}
          MACOS: ${{ needs.checks.outputs.macos }}
        run: |
          echo "guard: $GUARD"
          echo "checks: $CHECKS (linux: ${LINUX:-none}, macos: ${MACOS:-none})"
          [ "$GUARD" = success ] && [ "$CHECKS" = success ] &&
            [ "$LINUX" = success ] && [ "$MACOS" = success ]
