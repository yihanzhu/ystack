# Private proposal: publication and dispatch require the separate reserved decision.
name: scope genuine macOS proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope-genuine-macos
  cancel-in-progress: false

jobs:
  genuine-scope:
    if: github.repository_id == '1270665750' && github.repository == 'yihanzhu/ystack' && github.event_name == 'workflow_dispatch' && github.actor == 'yihanzhu' && github.triggering_actor == 'yihanzhu' && github.ref == 'refs/heads/ystack/impl/scope-gate-hardening' && github.workflow_ref == 'yihanzhu/ystack/.github/workflows/scope-genuine-macos.yml@refs/heads/ystack/impl/scope-gate-hardening' && github.workflow_sha == github.sha
    runs-on: macos-15-intel
    timeout-minutes: 100
    env:
      YSTACK_SELECTED_SHA: ${{ github.sha }}
      YSTACK_WORKFLOW_SHA: ${{ github.workflow_sha }}
      YSTACK_WORKFLOW_REF: ${{ github.workflow_ref }}
      PATH: /usr/bin:/bin:/usr/sbin:/sbin
      LC_ALL: C
      LANG: C
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed host and source; supply only the fixed owned runtime
        timeout-minutes: 5
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = yihanzhu/ystack
          test "$GITHUB_REPOSITORY_ID" = 1270665750
          test "$GITHUB_ACTOR" = yihanzhu
          test "$GITHUB_TRIGGERING_ACTOR" = yihanzhu
          test "$GITHUB_REF" = refs/heads/ystack/impl/scope-gate-hardening
          test "$YSTACK_WORKFLOW_REF" = yihanzhu/ystack/.github/workflows/scope-genuine-macos.yml@refs/heads/ystack/impl/scope-gate-hardening
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = X64
          test "$(/usr/bin/uname -s)" = Darwin
          test "$(/usr/bin/uname -m)" = x86_64
          [[ "$YSTACK_SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$YSTACK_SELECTED_SHA" = "$GITHUB_SHA"
          test "$YSTACK_WORKFLOW_SHA" = "$YSTACK_SELECTED_SHA"
          test "$(/usr/bin/git rev-parse HEAD)" = "$YSTACK_SELECTED_SHA"
          workflow_blob=$(/usr/bin/git rev-parse "$YSTACK_WORKFLOW_SHA:.github/workflows/scope-genuine-macos.yml")
          test "$(/usr/bin/git hash-object .github/workflows/scope-genuine-macos.yml)" = "$workflow_blob"
          /usr/bin/printf 'selected_sha=%s workflow_sha=%s workflow_blob=%s\n' "$YSTACK_SELECTED_SHA" "$YSTACK_WORKFLOW_SHA" "$workflow_blob"
          /usr/bin/git merge-base --is-ancestor bde9921177d055c3f32e43b9e10486c6d44b2748 HEAD
          test -z "$(/usr/bin/git status --porcelain=v1)"
          /usr/bin/printf 'repo=1270665750 branch=ystack/impl/scope-gate-hardening issue=541 implementation_PR=558 candidate=%s\n' "$YSTACK_SELECTED_SHA"
          for tool in /bin/cat /usr/bin/shasum /usr/bin/awk /usr/bin/mktemp /usr/bin/python3 /usr/bin/openssl /usr/bin/security /usr/bin/git /usr/bin/cc /usr/bin/sudo /usr/bin/perl /usr/bin/dscl /usr/sbin/dseditgroup /usr/bin/stat /bin/chmod /usr/sbin/chown /bin/mkdir /bin/cp /bin/rm /usr/bin/id /usr/bin/false; do
            test -f "$tool" || {
              /usr/bin/printf 'precache_failure tool=%s predicate=regular\n' "$tool" >&2 || exit 1
              exit 1
            }
            test ! -L "$tool" || {
              /usr/bin/printf 'precache_failure tool=%s predicate=not-link\n' "$tool" >&2 || exit 1
              exit 1
            }
            test -x "$tool" || {
              /usr/bin/printf 'precache_failure tool=%s predicate=executable\n' "$tool" >&2 || exit 1
              exit 1
            }
          done
          test -z "${__PYVENV_LAUNCHER__+present}" || {
            /usr/bin/printf 'precache_failure check=environment-1\n' >&2 || exit 1
            exit 1
          }
          for guard_variable in "${!DYLD_@}"; do
            test -z "$guard_variable" || {
              /usr/bin/printf 'precache_failure check=environment-2\n' >&2 || exit 1
              exit 1
            }
          done
          /usr/bin/sudo -n /usr/bin/true || {
            precache_status=$?
            /usr/bin/printf 'precache_failure check=sudo\n' >&2 || exit "$precache_status"
            exit "$precache_status"
          }
          test ! -e /Library/Frameworks/Python.framework/Versions/3.15 || {
            /usr/bin/printf 'precache_failure check=version-absent-entry\n' >&2 || exit 1
            exit 1
          }
          test ! -L /Library/Frameworks/Python.framework/Versions/3.15 || {
            /usr/bin/printf 'precache_failure check=version-absent-link\n' >&2 || exit 1
            exit 1
          }
          test ! -e /Library/Frameworks/Python.framework/ystack-private-tools || {
            /usr/bin/printf 'precache_failure check=tools-absent-entry\n' >&2 || exit 1
            exit 1
          }
          test ! -L /Library/Frameworks/Python.framework/ystack-private-tools || {
            /usr/bin/printf 'precache_failure check=tools-absent-link\n' >&2 || exit 1
            exit 1
          }
          test ! -e /usr/local/libexec/ystack-sandbox/v1/supervisor || {
            /usr/bin/printf 'precache_failure check=anchor-absent-entry\n' >&2 || exit 1
            exit 1
          }
          test ! -L /usr/local/libexec/ystack-sandbox/v1/supervisor || {
            /usr/bin/printf 'precache_failure check=anchor-absent-link\n' >&2 || exit 1
            exit 1
          }
          test ! -e "/usr/local/libexec/ystack-scope-fixture.${YSTACK_SELECTED_SHA:0:8}" || {
            /usr/bin/printf 'precache_failure check=fixture-absent-entry\n' >&2 || exit 1
            exit 1
          }
          test ! -L "/usr/local/libexec/ystack-scope-fixture.${YSTACK_SELECTED_SHA:0:8}" || {
            /usr/bin/printf 'precache_failure check=fixture-absent-link\n' >&2 || exit 1
            exit 1
          }
          cache_root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/ystack-mac-proof.XXXXXX") || {
            precache_status=$?
            /usr/bin/printf 'precache_failure check=cache-create\n' >&2 || exit "$precache_status"
            exit "$precache_status"
          }
          cache_root=$(CDPATH='' cd -P -- "$cache_root" && pwd -P) || {
            precache_status=$?
            /usr/bin/printf 'precache_failure check=cache-physical-path\n' >&2 || exit "$precache_status"
            exit "$precache_status"
          }
          identity=$(/usr/bin/stat -f '%d:%i:%u' "$cache_root") || {
            precache_status=$?
            /usr/bin/printf 'precache_failure check=cache-identity\n' >&2 || exit "$precache_status"
            exit "$precache_status"
          }
          /usr/bin/printf 'YSTACK_PROOF_TMP=%s\nYSTACK_PROOF_TMP_ID=%s\nTMPDIR=%s\n' "$cache_root" "$identity" "$cache_root" >> "$GITHUB_ENV" || {
            # shellcheck disable=SC2320
            precache_status=$?
            /usr/bin/printf 'precache_failure check=cache-environment-record\n' >&2 || exit "$precache_status"
            exit "$precache_status"
          }
          /bin/cat > "$cache_root/provision.py" <<'PY_MAC_PROVISION'
          import base64
          import ctypes
          import errno
          import gzip
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import selectors
          import signal
          import struct
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          import zlib

          ROOT = Path('/Library/Frameworks/Python.framework')
          V = ROOT / 'Versions/3.15'
          T = ROOT / 'ystack-private-tools'
          TREES = (V, T)
          P = V / 'Resources/Python.app/Contents/MacOS/Python'
          JQ = ROOT / 'ystack-private-tools/jq'
          FIELDS = ('st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_gid', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns')
          PKG_SHA = '7c7e7eca61cbfa5f0c6f80cd594cddbfd492f4e8b3fb87e3d9fa1efebaec43ed'
          JQ_SHA = '5c0a0a3ea600f302ee458b30317425dd9632d1ad8882259fcaf4e9b868b2b1ef'
          MANIFEST_SHA = 'e0d204e2827885c5f2f4278e709981b7fc1e02424d3bfa5ae2ff2af789789d26'
          TOC_SHA = '72a73d8e5b05959f062df93f21e5829a5aac4526c833dd24cba4941462a29924'
          cache = Path(sys.argv[1])
          assert cache.is_absolute() and cache.resolve() == cache
          assert sys.platform == 'darwin' and os.getuid() != 0
          assert sys.flags.isolated and sys.flags.no_site and sys.flags.dont_write_bytecode
          def uptime():
              value = time.clock_gettime(time.CLOCK_UPTIME_RAW)
              assert type(value) is float and math.isfinite(value) and value >= 0
              return value


          started = uptime()
          deadline = started + 270
          owned = []
          staging = []
          parents = {}
          parent_records = {}
          ancestors = {}
          created = set()
          held = []
          shared_components = {}
          journal = None
          commands = 0
          cancel_requested = 0

          def interrupted(signum, frame):
              global cancel_requested
              if not cancel_requested:
                  cancel_requested = signum

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          lib = ctypes.CDLL('/usr/lib/libSystem.B.dylib', use_errno=True)
          lib.acl_get_fd_np.argtypes = [ctypes.c_int, ctypes.c_int]
          lib.acl_get_fd_np.restype = ctypes.c_void_p
          lib.acl_get_link_np.argtypes = [ctypes.c_char_p, ctypes.c_int]
          lib.acl_get_link_np.restype = ctypes.c_void_p
          lib.acl_free.argtypes = [ctypes.c_void_p]
          lib.acl_free.restype = ctypes.c_int


          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii')


          def ident(value):
              return [getattr(value, field) for field in FIELDS]


          def budget():
              if cancel_requested:
                  raise SystemExit(128 + cancel_requested)
              assert type(deadline) in (int, float) and math.isfinite(deadline) and uptime() < deadline


          def empty_acl(value):
              error = ctypes.get_errno()
              if value:
                  assert lib.acl_free(value) == 0
                  raise ValueError('nonempty or unknown ACL before UUID resolver')
              assert error == errno.ENOENT


          def acquire_component(path, before, fd, name):
              if path in shared_components:
                  component = shared_components[path]
                  try:
                      assert component[1] == before == ident(os.fstat(component[2]))
                  finally:
                      os.close(fd)
                  component[4] += 1
                  return component
              component = [path, before, fd, name, 1]
              shared_components[path] = component
              return component


          def release_component(component):
              component[4] -= 1
              assert component[4] >= 0
              if component[4] == 0:
                  del shared_components[component[0]]
                  os.close(component[2])


          def physical(path, directory=False, immutable=True):
              budget()
              assert path.is_absolute() and path.resolve() == path
              chain = []
              result = None
              try:
                  fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  chain.append(acquire_component('/', ident(os.fstat(fd)), fd, None))
                  for index, name in enumerate(path.parts[1:]):
                      before = os.stat(name, dir_fd=chain[-1][2], follow_symlinks=False)
                      isdir = index < len(path.parts) - 2 or directory
                      assert stat.S_ISDIR(before.st_mode) if isdir else stat.S_ISREG(before.st_mode)
                      if immutable:
                          assert before.st_uid == 0 and not before.st_mode & 0o022, (
                              'immutable-parent component=/' + '/'.join(path.parts[1:index + 2]) +
                              f' uid={before.st_uid} mode={before.st_mode:#o}')
                      child = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | (os.O_DIRECTORY if isdir else 0), dir_fd=chain[-1][2])
                      component = str(Path('/').joinpath(*path.parts[1:index + 2]))
                      chain.append(acquire_component(component, ident(before), child, name))
                      assert ident(os.fstat(chain[-1][2])) == ident(before)
                      if not isdir:
                          assert before.st_nlink == 1 and before.st_size <= 16 * 1024 * 1024
                  result = (str(path), chain[-1][1], chain[-1][2], chain)
                  recheck_one(result)
                  held.append(result)
                  return result
              except BaseException:
                  for component in reversed(chain):
                      release_component(component)
                  raise


          def recheck_one(record):
              for index, (path, before, fd, name, refs) in enumerate(record[3]):
                  budget()
                  current = os.fstat(fd)
                  named = os.lstat('/') if name is None else os.stat(name, dir_fd=record[3][index - 1][2], follow_symlinks=False)
                  assert ident(current) == before == ident(named)
                  assert current.st_uid == 0 and not current.st_mode & 0o022
                  ctypes.set_errno(0)
                  empty_acl(lib.acl_get_fd_np(fd, 0x100))


          def recheck():
              for record in held:
                  recheck_one(record)


          def close_physical(record):
              held.remove(record)
              error = None
              for component in reversed(record[3]):
                  try:
                      release_component(component)
                  except OSError as failure:
                      error = error or failure
              if error is not None:
                  raise error


          def close_all_physical():
              original = sys.exc_info()[1]
              error = None
              for record in tuple(reversed(held)):
                  try:
                      close_physical(record)
                  except OSError as failure:
                      error = error or failure
              if error is not None:
                  if original is not None:
                      raise original from error
                  raise error
              assert not held and not shared_components
              if cancel_requested:
                  raise SystemExit(128 + cancel_requested)


          def in_trees(path):
              return any(path == tree or tree in path.parents for tree in TREES)


          def child_snapshot(record):
              recheck_one(record)
              children = {}
              counted = len(owned) + len(ancestors) + sum(len(row['children']) for name, row in parents.items() if name != record[0])
              with os.scandir(record[2]) as entries:
                  for entry in entries:
                      budget()
                      name = entry.name
                      assert name not in ('.', '..') and '/' not in name
                      assert counted + len(children) < 16384
                      before = os.stat(name, dir_fd=record[2], follow_symlinks=False)
                      target = os.readlink(name, dir_fd=record[2]) if stat.S_ISLNK(before.st_mode) else None
                      assert ident(os.stat(name, dir_fd=record[2], follow_symlinks=False)) == ident(before)
                      children[name] = {'identity': ident(before), 'target': target}
              recheck_one(record)
              return children


          def check_parents():
              total = len(owned) + len(ancestors)
              for name, expected in parents.items():
                  record = parent_records[name]
                  recheck_one(record)
                  assert record[1] == expected['identity']
                  actual = child_snapshot(record)
                  new_names = {tree.name for tree in TREES if str(tree.parent) == name and str(tree) in created}
                  assert set(actual) == set(expected['children']) | new_names
                  assert {key: row for key, row in actual.items() if key not in new_names} == expected['children']
                  total += len(expected['children'])
              assert total <= 16384


          def open_parents(saved=None, saved_ancestors=None):
              for path in (ROOT, V.parent):
                  record = physical(path, True)
                  parent_records[str(path)] = record
                  if saved is None:
                      assert all(not os.path.lexists(tree) for tree in TREES)
                      children = child_snapshot(record)
                      parents[str(path)] = {'identity': record[1].copy(), 'children': children,
                                            'original_names': sorted(children)}
              if saved is not None:
                  assert set(saved) == {str(ROOT), str(V.parent)}
                  parents.update(saved)
              for record in parent_records.values():
                  for name, before, fd, edge, refs in record[3]:
                      if name not in parents:
                          ancestors[name] = before.copy()
              if saved is not None:
                  assert ancestors == saved_ancestors
              check_parents()


          def mutation_names(argv):
              changes = {}
              if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/mkdir']:
                  assert argv[3:5] == ['-m', '0755'] and len(argv) == 6
                  path = Path(argv[5])
                  assert path in TREES and str(path) not in created and not os.path.lexists(path)
                  changes[str(path.parent)] = ({path.name}, set())
              elif argv[:3] == ['/usr/bin/sudo', '-n', '/bin/cp']:
                  path = Path(argv[-1])
                  assert path in TREES and str(path) in created
                  relative = path.relative_to(ROOT)
                  assert argv[3:] == ['-R', '-P', '-n', str(cache / 'stage' / relative) + '/.', str(path)]
                  assert not os.listdir(path)
                  changes[str(path)] = ({Path(name).parts[len(relative.parts)] for name in expected
                                        if Path(name).is_relative_to(relative) and name != str(relative)}, set())
              elif argv[:3] == ['/usr/bin/sudo', '-n', '/bin/rm']:
                  assert argv[3] in ('-f', '-d') and argv[4] == '--' and 0 < len(argv[5:]) <= 128
                  for name in argv[5:]:
                      path = Path(name)
                      assert in_trees(path) and str(path) in created | {item['path'] for item in owned}
                      changes.setdefault(str(path.parent), (set(), set()))[1].add(path.name)
              elif argv[:3] == ['/usr/bin/sudo', '-n', '/bin/chmod']:
                  assert argv[3:5] == ['-h', '0755'] and len(argv) == 6
                  assert any(item['path'] == argv[5] and item['kind'] == 'link' for item in owned)
              else:
                  assert argv[0] != '/usr/bin/sudo'
              return changes


          def held_directories():
              result = {}
              for record in held:
                  for path, before, fd, name, refs in record[3]:
                      if stat.S_ISDIR(before[2]):
                          result.setdefault(path, (before, fd))
              return result


          def bounded_command(argv, expected, stream_phase=False):
              global last_child_outcome
              last_child_outcome = {"pid": None, "returncode": None, "reaped": False, "cancelled": False, "privileged_unknown": False}
              budget()
              child_deadline = deadline - 2
              assert uptime() < child_deadline
              process = None
              selector = None
              completed = False
              output, errors = bytearray(), bytearray()
              try:
                  budget()
                  process = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                             stderr=subprocess.PIPE, close_fds=True, umask=0o022)
                  last_child_outcome["pid"] = process.pid
                  budget()
                  selector = selectors.DefaultSelector()
                  budget()
                  assert process.stdout is not None and process.stderr is not None
                  for stream, target in ((process.stdout, output), (process.stderr, errors)):
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, selectors.EVENT_READ, target)
                      budget()
                  while selector.get_map():
                      budget()
                      remaining = child_deadline - uptime()
                      assert remaining > 0
                      for key, events in selector.select(min(remaining, 0.25)):
                          budget()
                          block = os.read(key.fileobj.fileno(), min(65536, 16 * 1024 * 1024 + 1 - len(output) - len(errors)))
                          if not block:
                              selector.unregister(key.fileobj)
                              continue
                          assert len(output) + len(errors) + len(block) <= 16 * 1024 * 1024
                          key.data.extend(block)
                          if stream_phase:
                              assert os.write(1 if key.data is output else 2, block) == len(block)
                  while True:
                      budget()
                      remaining = child_deadline - uptime()
                      assert remaining > 0
                      try:
                          status = process.wait(timeout=min(remaining, 0.25))
                          break
                      except subprocess.TimeoutExpired:
                          pass
                  budget()
                  completed = status == expected
                  assert status == expected, (argv[0], status)
                  return bytes(output)
              finally:
                  close_unknown = False
                  if selector is not None:
                      try:
                          selector.close()
                      except OSError:
                          close_unknown = True
                  for stream in (() if process is None else (process.stdout, process.stderr)):
                      if stream is not None:
                          try:
                              stream.close()
                          except OSError:
                              close_unknown = True
                  if process is not None and (not completed or cancel_requested):
                      reaped = False
                      try:
                          if process.poll() is None:
                              try:
                                  process.terminate()
                              except OSError:
                                  pass
                              try:
                                  remaining = deadline - uptime()
                                  if remaining > 0:
                                      process.wait(timeout=min(0.5, remaining))
                              except subprocess.TimeoutExpired:
                                  pass
                              if process.poll() is None:
                                  try:
                                      process.kill()
                                  except OSError:
                                      pass
                          remaining = deadline - uptime()
                          if process.poll() is None and remaining > 0:
                              process.wait(timeout=remaining)
                          reaped = process.poll() is not None
                      except (OSError, subprocess.TimeoutExpired):
                          pass
                      diagnostic = canonical({'fixed_command_failed': True, 'direct_child_pid': process.pid,
                          'direct_child_reaped': reaped, 'sudo_subcommand_state': 'unknown' if argv[0] == '/usr/bin/sudo' else 'not-applicable'}) + b'\n'
                      try:
                          os.write(2, diagnostic)
                      except OSError:
                          pass
                      last_child_outcome = {'pid': process.pid, 'returncode': process.returncode, 'reaped': reaped,
                          'cancelled': bool(cancel_requested), 'privileged_unknown': argv[0] == '/usr/bin/sudo'}
                      if not reaped:
                          raise RuntimeError('owned direct-child cancellation or reap unknown')
                  last_child_outcome = {'pid': None if process is None else process.pid,
                      'returncode': None if process is None else process.returncode,
                      'reaped': process is not None and process.returncode is not None,
                      'cancelled': bool(cancel_requested),
                      'privileged_unknown': argv[0] == '/usr/bin/sudo' and not completed}
                  if close_unknown:
                      raise RuntimeError('owned command pipe or selector close unknown')
                  if cancel_requested:
                      raise SystemExit(128 + cancel_requested)


          def run(argv, expected=0):
              global commands
              budget()
              commands += 1
              assert commands <= 256 and len(argv) <= 256
              assert sum(len(os.fsencode(arg)) + 1 for arg in argv) <= 65536
              recheck()
              check_parents()
              if journal is not None:
                  assert journal_snapshot() == journal
              changes = mutation_names(argv)
              directories = held_directories()
              names_before = {}
              for path, (additions, removals) in changes.items():
                  assert path in directories
                  names = set(os.listdir(directories[path][1]))
                  assert len(names) <= 16384 and not names & additions and removals <= names
                  names_before[path] = names
              parent_mode.reserve(argv)
              try:
                  output = bounded_command(argv, expected)
              except BaseException:
                  known = argv[0] != '/usr/bin/sudo' and parent_mode.settled(last_child_outcome)
                  parent_mode.complete(known)
                  raise
              if journal is not None:
                  assert journal_snapshot() == journal
              for path, (additions, removals) in changes.items():
                  assert set(os.listdir(directories[path][1])) == (names_before[path] | additions) - removals
              for record in held:
                  for index, component in enumerate(record[3]):
                      path, before, fd, name, refs = component
                      if path not in changes:
                          continue
                      current = os.fstat(fd)
                      named = os.lstat('/') if name is None else os.stat(name, dir_fd=record[3][index - 1][2], follow_symlinks=False)
                      after = ident(current)
                      assert after == ident(named) and stat.S_ISDIR(after[2])
                      assert all(after[field] == before[field] for field in (0, 1, 2, 3, 4))
                      assert current.st_uid == 0 and not current.st_mode & 0o022
                      ctypes.set_errno(0)
                      empty_acl(lib.acl_get_fd_np(fd, 0x100))
                      component[1][:] = after
              if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/mkdir']:
                  created.add(argv[5])
              if argv[:4] == ['/usr/bin/sudo', '-n', '/bin/rm', '-d']:
                  created.difference_update(argv[5:])
              for name in changes:
                  if name in parents:
                      parents[name]['identity'] = parent_records[name][1].copy()
                      if name == str(V.parent):
                          parents[str(ROOT)]['children']['Versions']['identity'] = parents[name]['identity'].copy()
              recheck()
              check_parents()
              if not changes and argv[0] != '/usr/bin/sudo':
                  parent_mode.complete(True)
              return output


          def journal_snapshot():
              path = cache / 'owned.json'
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  assert stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_nlink == 1
                  assert 0 <= before.st_size <= 4 * 1024 * 1024
                  raw = bytearray()
                  while True:
                      budget()
                      block = os.read(fd, min(65536, 4 * 1024 * 1024 + 1 - len(raw)))
                      if not block:
                          break
                      raw.extend(block)
                      assert len(raw) <= 4 * 1024 * 1024
                  assert ident(os.fstat(fd)) == ident(before) == ident(path.lstat())
                  return ident(before), bytes(raw)
              finally:
                  os.close(fd)


          def save():
              global journal
              check_parents()
              raw = canonical({'root': str(ROOT), 'objects': owned, 'parents': parents, 'created': sorted(created), 'ancestors': ancestors, 'staging': staging})
              assert len(raw) <= 4 * 1024 * 1024
              target = cache / 'owned.json'
              with target.open('wb') as output:
                  output.write(raw)
                  output.flush()
                  os.fsync(output.fileno())
              journal = journal_snapshot()
              assert journal[1] == raw
              if parent_mode.pending is not None:
                  parent_mode.complete(True, json.loads(canonical(parents)), hashlib.sha256(raw).hexdigest())


          def link(path, expected, writable=False):
              parent = physical(path.parent, True)
              before = path.lstat()
              assert stat.S_ISLNK(before.st_mode) and before.st_uid == 0 and before.st_nlink == 1
              assert writable or not before.st_mode & 0o022
              assert os.readlink(path) == expected
              ctypes.set_errno(0)
              empty_acl(lib.acl_get_link_np(os.fsencode(path), 0x100))
              assert ident(path.lstat()) == ident(before) and os.readlink(path) == expected
              recheck_one(parent)
              close_physical(parent)
              return ident(before)


          def cleanup():
              global journal
              journal = journal_snapshot()
              assert hashlib.sha256(journal[1]).hexdigest() == os.environ['YSTACK_RUNTIME_OWNED_SHA']
              receipt = json.loads(journal[1])
              assert len(receipt['staging']) <= 16384
              for name, before in receipt['staging']:
                  path = Path(name)
                  assert path == cache / 'stage' or cache / 'stage' in path.parents
                  assert ident(path.lstat()) == before
              staging[:] = receipt['staging']
              assert receipt['root'] == str(ROOT) and len(receipt['objects']) <= 16384
              objects = {item['path']: item for item in receipt['objects']}
              assert len(objects) == len(receipt['objects'])
              assert set(receipt['created']) <= {str(tree) for tree in TREES}
              created.update(receipt['created'])
              owned[:] = list(objects.values())
              open_parents(receipt['parents'], receipt['ancestors'])
              actual = set()
              for tree in TREES:
                  if str(tree) not in created:
                      assert not os.path.lexists(tree)
                      continue
                  assert str(tree) in objects
                  root_record = physical(tree, True)
                  assert root_record[1] == objects[str(tree)]['identity']
                  close_physical(root_record)
                  for directory, dirs, files in os.walk(tree, followlinks=False):
                      budget()
                      actual.add(directory)
                      actual.update(str(Path(directory) / name) for name in dirs + files)
                      assert len(actual) + sum(len(row['children']) for row in parents.values()) <= 16384
              assert actual == set(objects)
              for name, item in objects.items():
                  path = Path(name)
                  assert in_trees(path)
                  assert ident(path.lstat()) == item['identity']
              leaves = sorted(name for name, row in objects.items() if row['kind'] != 'directory')
              levels = sorted({len(Path(name).parts) for name, row in objects.items() if row['kind'] == 'directory'}, reverse=True)
              batches = [(False, leaves[offset:offset + 128]) for offset in range(0, len(leaves), 128)]
              for depth in levels:
                  names = sorted(name for name, row in objects.items() if row['kind'] == 'directory' and len(Path(name).parts) == depth)
                  batches.extend((True, names[offset:offset + 128]) for offset in range(0, len(names), 128))
              for directory, names in batches:
                  batch_parents = {}
                  for name in names:
                      path = Path(name)
                      if str(path.parent) not in batch_parents:
                          batch_parents[str(path.parent)] = physical(path.parent, True)
                          for component, before, fd, edge, refs in batch_parents[str(path.parent)][3]:
                              if component in objects:
                                  assert before == objects[component]['identity']
                      assert ident(path.lstat()) == objects[name]['identity']
                      if directory:
                          assert not list(path.iterdir())
                  run(['/usr/bin/sudo', '-n', '/bin/rm', '-d' if directory else '-f', '--', *names])
                  for name in names:
                      assert not os.path.lexists(name)
                      del objects[name]
                  owned[:] = list(objects.values())
                  for name, record in batch_parents.items():
                      current = ident(os.fstat(record[2]))
                      assert current == ident(Path(name).lstat())
                      assert all(current[index] == record[1][index] for index in (0, 1, 2, 3, 4))
                      if name in objects:
                          objects[name]['identity'] = current
                      recheck_one(record)
                      close_physical(record)
                  save()
              assert not objects and not created and all(not os.path.lexists(tree) for tree in TREES)
              check_parents()
              assert all(sorted(row['children']) == row['original_names'] for row in parents.values())
              print(canonical({'cleanup': 'two-owned-trees-absent', 'parents': parents}).decode('ascii'))


          def copy_inventory_failure(tree, found, subset, copied):
              try:
                  budget()
                  assert tree in TREES
                  missing = sorted(set(subset) - found)
                  extra = sorted(found - set(subset))
                  record = {'copy_inventory_failure': True, 'tree': 'V' if tree == V else 'T',
                            'found': len(found), 'subset': len(subset), 'copied': len(copied), 'truncated': False}
                  for label, values in (('missing', missing), ('extra', extra)):
                      record[label] = {'count': len(values), 'sha256': hashlib.sha256(canonical(values)).hexdigest(),
                                       'prefix': [], 'truncated': bool(values)}
                  for label, values in (('missing', missing), ('extra', extra)):
                      for value in values[:32]:
                          budget()
                          record[label]['prefix'].append(value)
                          record[label]['truncated'] = len(record[label]['prefix']) < len(values)
                          record['truncated'] = any(record[key]['truncated'] for key in ('missing', 'extra'))
                          if len(canonical(record)) + 1 > 16384:
                              record[label]['prefix'].pop()
                              record[label]['truncated'] = True
                              break
                  record['truncated'] = any(record[key]['truncated'] for key in ('missing', 'extra'))
                  raw = canonical(record) + b'\n'
                  assert len(raw) <= 16384
                  budget()
                  assert os.write(2, raw) == len(raw)
              except BaseException:
                  pass


          class VersionsParentMode:
              RECORD_LIMIT = 4 * 1024 * 1024
              ENV_KEY = 'YSTACK_VERSIONS_MODE_STATE'
              PHASES = ('supply', 'scope', 'native', 'closure')

              def __init__(self):
                  self.cache_fd = os.open(cache, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  self.cache_identity = ident(os.fstat(self.cache_fd))
                  assert self.cache_identity == ident(cache.lstat())
                  assert self.cache_identity[3] == os.getuid() and self.cache_identity[2] == stat.S_IFDIR | 0o700
                  self.cache_binding = self.cache_identity[:5]
                  self.context = {key: os.environ[key] for key in
                                  ('YSTACK_SELECTED_SHA', 'YSTACK_WORKFLOW_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB')}
                  assert re.fullmatch('[0-9a-f]{40}', self.context['YSTACK_SELECTED_SHA'])
                  assert self.context['YSTACK_SELECTED_SHA'] == self.context['YSTACK_WORKFLOW_SHA']
                  assert all(re.fullmatch('[A-Za-z0-9_-]{1,64}', value) for value in self.context.values())
                  self.binding = None
                  self.baseline = None
                  self.rows = []
                  self.pending = None
                  self.root_record = None
                  self.d_fd = None
                  self.d_identity = None
                  self.expected_parents = None
                  self.env_seen = None

              @staticmethod
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      assert key not in result
                      result[key] = value
                  return result

              def cache_check(self):
                  actual = ident(os.fstat(self.cache_fd))
                  assert actual == ident(cache.lstat()) and actual[:5] == self.cache_binding
                  assert stat.S_ISDIR(actual[2]) and not actual[2] & 0o077

              def read_record(self, name):
                  self.cache_check()
                  assert name in ('versions-mode-original.json', 'provision-actions.jsonl')
                  fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=self.cache_fd)
                  try:
                      before = ident(os.fstat(fd))
                      assert before[2] == stat.S_IFREG | 0o600 and before[3] == os.getuid() and before[5] == 1
                      assert 0 <= before[6] <= self.RECORD_LIMIT
                      raw = bytearray()
                      while True:
                          budget()
                          block = os.read(fd, min(65536, self.RECORD_LIMIT + 1 - len(raw)))
                          if not block:
                              break
                          raw.extend(block)
                          assert len(raw) <= self.RECORD_LIMIT
                      assert len(raw) == before[6]
                      assert before == ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=self.cache_fd, follow_symlinks=False))
                      self.cache_check()
                      return {'identity': before, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}, bytes(raw)
                  finally:
                      os.close(fd)

              def create_record(self, name, raw):
                  self.cache_check()
                  assert name in ('versions-mode-original.json', 'provision-actions.jsonl') and len(raw) <= self.RECORD_LIMIT
                  fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=self.cache_fd)
                  try:
                      state = os.fstat(fd)
                      assert stat.S_ISREG(state.st_mode) and state.st_uid == os.getuid() and state.st_nlink == 1
                      assert stat.S_IMODE(state.st_mode) == 0o600
                      position = 0
                      while position < len(raw):
                          count = os.write(fd, raw[position:position + 65536])
                          assert count > 0
                          position += count
                      os.fsync(fd)
                  finally:
                      os.close(fd)
                  os.fsync(self.cache_fd)
                  binding, actual = self.read_record(name)
                  assert actual == raw
                  return binding

              def publication(self, value=None):
                  path = Path(os.environ['GITHUB_ENV'])
                  fd = os.open(path, os.O_RDWR | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      before = ident(os.fstat(fd))
                      assert stat.S_ISREG(before[2]) and before[3] == os.getuid() and before[5] == 1
                      assert before == ident(path.lstat()) and before[6] <= 16 * 1024 * 1024
                      os.lseek(fd, 0, os.SEEK_SET)
                      existing = bytearray()
                      while True:
                          block = os.read(fd, 65536)
                          if not block:
                              break
                          existing.extend(block)
                          assert len(existing) <= 16 * 1024 * 1024
                      assert ident(os.fstat(fd)) == before == ident(path.lstat())
                      if value is not None:
                          line = self.ENV_KEY.encode() + b'=' + base64.b64encode(canonical(value)) + b'\n'
                          assert len(line) <= 16384 and len(existing) + len(line) <= 16 * 1024 * 1024
                          assert not existing or existing[-1:] == b'\n'
                          assert os.write(fd, line) == len(line)
                          os.fsync(fd)
                          after = ident(os.fstat(fd))
                          assert after == ident(path.lstat()) and after[:6] == before[:6]
                          os.lseek(fd, before[6], os.SEEK_SET)
                          assert os.read(fd, len(line) + 1) == line
                          text = line[len(self.ENV_KEY) + 1:-1].decode('ascii')
                          os.environ[self.ENV_KEY] = text
                          self.env_seen = text
                          return value
                      matches = [line[len(self.ENV_KEY) + 1:] for line in bytes(existing).splitlines()
                                 if line.startswith(self.ENV_KEY.encode() + b'=')]
                      text = matches[-1].decode('ascii') if matches else os.environ.get(self.ENV_KEY)
                      assert text and len(text) <= 16384
                      raw = base64.b64decode(text, validate=True)
                      result = json.loads(raw, object_pairs_hook=self.unique)
                      assert canonical(result) == raw
                      self.env_seen = text
                      return result
                  finally:
                      os.close(fd)

              def publish(self):
                  action, raw = self.read_record('provision-actions.jsonl')
                  original = None
                  if self.baseline is not None:
                      original, body = self.read_record('versions-mode-original.json')
                      assert body == canonical(self.baseline)
                  value = {'version': 1, 'cache': self.cache_binding, 'context': self.context,
                           'original': original, 'actions': action}
                  self.publication(value)
                  self.binding = value

              def load(self):
                  value = self.publication()
                  assert type(value) is dict and set(value) == {'version', 'cache', 'context', 'original', 'actions'}
                  assert value['version'] == 1 and value['cache'] == self.cache_binding and value['context'] == self.context
                  binding, raw = self.read_record('provision-actions.jsonl')
                  assert binding == value['actions']
                  if value['original'] is not None:
                      original, body = self.read_record('versions-mode-original.json')
                      assert original == value['original']
                      baseline = json.loads(body, object_pairs_hook=self.unique)
                      assert canonical(baseline) == body and type(baseline) is dict
                      assert set(baseline) == {'version', 'context', 'cache', 'd', 'ancestors', 'root_children', 'd_children', 'acl'}
                      assert baseline['version'] == 1 and baseline['context'] == self.context and baseline['cache'] == self.cache_binding
                      assert type(baseline['d']) is list and len(baseline['d']) == 9
                      assert baseline['d'][2] == stat.S_IFDIR | 0o775 and baseline['d'][3] == 0
                      assert all(type(value) is int for value in baseline['d'])
                      assert type(baseline['ancestors']) is dict and str(ROOT) in baseline['ancestors']
                      for name, identity in baseline['ancestors'].items():
                          assert type(name) is str and name.startswith('/') and type(identity) is list and len(identity) == 9
                          assert all(type(field) is int for field in identity)
                          assert stat.S_ISDIR(identity[2]) and identity[3] == 0 and not identity[2] & 0o022
                      assert baseline['acl'] == {name: 'empty' for name in [*baseline['ancestors'], str(V.parent)]}
                      for children in (baseline['root_children'], baseline['d_children']):
                          assert type(children) is dict and len(children) <= 16384
                          for name, row in children.items():
                              assert type(name) is str and name and name not in ('.', '..') and '/' not in name
                              assert type(row) is dict and 'identity' in row and set(row) == {'identity', 'target'}
                              assert type(row['identity']) is list and len(row['identity']) == 9
                              assert all(type(field) is int for field in row['identity'])
                              assert (row['target'] is not None) == stat.S_ISLNK(row['identity'][2])
                              if row['target'] is not None:
                                  assert type(row['target']) is str and len(os.fsencode(row['target'])) <= 4096
                      assert len(baseline['root_children']) + len(baseline['d_children']) + len(baseline['ancestors']) <= 16384
                      assert baseline['root_children']['Versions'] == {'identity': baseline['d'], 'target': None}
                      assert T.name not in baseline['root_children'] and V.name not in baseline['d_children']
                      self.baseline = baseline
                  else:
                      assert not os.path.lexists(cache / 'versions-mode-original.json')
                  rows, previous, issued, results, phases = [], '0' * 64, {}, set(), []
                  for line in raw.splitlines(keepends=True):
                      row = json.loads(line, object_pairs_hook=self.unique)
                      assert canonical(row) + b'\n' == line
                      assert set(row) == {'sequence', 'previous', 'kind', 'body'}
                      assert type(row['sequence']) is int and row['sequence'] == len(rows)
                      assert row['previous'] == previous and row['kind'] in ('issued', 'result', 'phase')
                      body = row['body']
                      assert type(body) is dict
                      if row['kind'] == 'issued':
                          assert set(body) == {'number', 'argv'} and type(body['number']) is int
                          assert body['number'] == len(issued) + 1 <= 256
                          argv = body['argv']
                          assert type(argv) is list and all(type(arg) is str for arg in argv)
                          assert len(argv) <= 256 and sum(len(os.fsencode(arg)) + 1 for arg in argv) <= 65536
                          self.fixed_command(argv)
                          issued[body['number']] = argv
                      elif row['kind'] == 'result':
                          assert set(body) == {'number', 'known', 'outcome', 'parents', 'owned_sha256'}
                          number = body['number']
                          assert type(number) is int and number in issued and number not in results
                          assert type(body['known']) is bool
                          outcome = body['outcome']
                          assert type(outcome) is dict and set(outcome) == {'pid', 'returncode', 'reaped', 'cancelled', 'privileged_unknown'}
                          assert outcome['pid'] is None or type(outcome['pid']) is int and outcome['pid'] > 0
                          assert outcome['returncode'] is None or type(outcome['returncode']) is int
                          assert all(type(outcome[key]) is bool for key in ('reaped', 'cancelled', 'privileged_unknown'))
                          if body['known']:
                              assert self.settled(outcome)
                              assert outcome['returncode'] == 0 or issued[number][0] != '/usr/bin/sudo'
                          assert body['owned_sha256'] is None or type(body['owned_sha256']) is str and re.fullmatch('[0-9a-f]{64}', body['owned_sha256'])
                          results.add(number)
                      else:
                          assert set(body) == {'phase', 'point', 'success', 'quiescent', 'deadline', 'outcome'}
                          assert body['phase'] in self.PHASES and body['point'] in ('enter', 'result')
                          assert type(body['success']) is bool and type(body['quiescent']) is bool
                          assert body['deadline'] is None if body['point'] == 'result' else type(body['deadline']) in (int, float) and math.isfinite(body['deadline']) and 0 < body['deadline'] < 1e12
                          if body['point'] == 'enter' or body['phase'] == 'closure':
                              assert body['outcome'] is None
                          else:
                              assert type(body['outcome']) is dict and set(body['outcome']) == {'pid', 'returncode', 'reaped', 'cancelled', 'privileged_unknown'}
                              if body['quiescent']:
                                  assert body['outcome']['reaped'] and not body['outcome']['cancelled']
                                  assert not body['outcome']['privileged_unknown']
                          assert (body['phase'], body['point']) not in phases
                          assert body['point'] == 'enter' or (body['phase'], 'enter') in phases
                          phases.append((body['phase'], body['point']))
                          assert len(phases) <= 8
                      previous = hashlib.sha256(line).hexdigest()
                      rows.append(row)
                  self.rows, self.binding = rows, value
                  return rows

              def append(self, kind, body):
                  self.load()
                  row = {'sequence': len(self.rows), 'previous': hashlib.sha256(canonical(self.rows[-1]) + b'\n').hexdigest()
                         if self.rows else '0' * 64, 'kind': kind, 'body': body}
                  binding, raw = self.read_record('provision-actions.jsonl')
                  assert binding == self.binding['actions']
                  data = canonical(row) + b'\n'
                  assert len(raw) + len(data) <= self.RECORD_LIMIT
                  fd = os.open('provision-actions.jsonl', os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW, dir_fd=self.cache_fd)
                  try:
                      assert ident(os.fstat(fd)) == binding['identity']
                      assert os.write(fd, data) == len(data)
                      os.fsync(fd)
                  finally:
                      os.close(fd)
                  self.publish()
                  self.load()

              def fixed_command(self, argv):
                  assert type(argv) is list and argv and all(type(arg) is str for arg in argv)
                  if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/chmod'] and argv[3:] in (
                          ['0755', '/Library/Frameworks/Python.framework/Versions'],
                          ['0775', '/Library/Frameworks/Python.framework/Versions']):
                      return
                  if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/mkdir']:
                      assert argv[3:5] == ['-m', '0755'] and len(argv) == 6 and Path(argv[5]) in TREES
                  elif argv[:3] == ['/usr/bin/sudo', '-n', '/bin/cp']:
                      assert len(argv) == 8 and argv[3:6] == ['-R', '-P', '-n']
                      target = Path(argv[7])
                      assert target in TREES and argv[6] == str(cache / 'stage' / target.relative_to(ROOT)) + '/.'
                  elif argv[:3] == ['/usr/bin/sudo', '-n', '/bin/chmod']:
                      assert argv[3:5] == ['-h', '0755'] and len(argv) == 6
                      assert Path(argv[5]).is_relative_to(V) and '..' not in Path(argv[5]).parts
                  elif argv[:3] == ['/usr/bin/sudo', '-n', '/bin/rm']:
                      assert argv[3] in ('-f', '-d') and argv[4] == '--' and 0 < len(argv[5:]) <= 128
                      assert all(in_trees(Path(arg)) and '..' not in Path(arg).parts for arg in argv[5:])
                  else:
                      forms = [
                          ['/usr/bin/openssl', 'x509', '-inform', 'DER', '-in', str(cache / 'cert-0.der'), '-pubkey', '-noout'],
                          ['/usr/bin/openssl', 'dgst', '-sha1', '-verify', str(cache / 'public.pem'), '-signature',
                           str(cache / 'signature.bin'), str(cache / 'toc.bin')],
                          ['/usr/bin/security', 'verify-cert', '-L', '-R', 'offline', '-N', '-p', 'basic',
                           '-c', str(cache / 'cert-0.der'), '-c', str(cache / 'cert-1.der')]]
                      assert argv in forms

              def reserve(self, argv):
                  self.load()
                  assert self.pending is None
                  self.fixed_command(argv)
                  issued = [row['body'] for row in self.rows if row['kind'] == 'issued']
                  completed = {row['body']['number'] for row in self.rows if row['kind'] == 'result' and row['body']['known']}
                  assert {row['number'] for row in issued} == completed
                  assert len(issued) < 256
                  if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/chmod'] and argv[-1] == str(V.parent):
                      assert not any(row['argv'] == argv for row in issued)
                  number = len(issued) + 1
                  self.append('issued', {'number': number, 'argv': argv})
                  self.pending = number
                  return number

              def complete(self, known, parent_state=None, owned_sha=None):
                  assert self.pending is not None
                  number = self.pending
                  self.append('result', {'number': number, 'known': known, 'outcome': last_child_outcome.copy(), 'parents': parent_state,
                                         'owned_sha256': owned_sha})
                  self.pending = None

              def phase(self, name, point, success=False, quiescent=False):
                  assert name in self.PHASES and point in ('enter', 'result')
                  self.append('phase', {'phase': name, 'point': point, 'success': success, 'quiescent': quiescent,
                                        'deadline': deadline if point == 'enter' else None,
                                        'outcome': last_child_outcome.copy() if point == 'result' and name != 'closure' else None})

              def close(self):
                  if self.d_fd is not None:
                      os.close(self.d_fd)
                      self.d_fd = None
                  if self.root_record is not None:
                      close_physical(self.root_record)
                      self.root_record = None
                  if self.cache_fd is not None:
                      os.close(self.cache_fd)
                      self.cache_fd = None

              def open_parent(self):
                  assert self.root_record is None and self.d_fd is None
                  self.root_record = physical(ROOT, True)
                  root_fd = self.root_record[2]
                  before = os.stat('Versions', dir_fd=root_fd, follow_symlinks=False)
                  assert stat.S_ISDIR(before.st_mode) and before.st_uid == 0
                  self.d_fd = os.open('Versions', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=root_fd)
                  self.d_identity = ident(before)
                  self.parent_check()

              def parent_check(self):
                  recheck_one(self.root_record)
                  named = os.stat('Versions', dir_fd=self.root_record[2], follow_symlinks=False)
                  assert self.d_identity == ident(named) == ident(os.fstat(self.d_fd))
                  ctypes.set_errno(0)
                  empty_acl(lib.acl_get_fd_np(self.d_fd, 0x100))
                  assert self.d_identity[3] == 0 and stat.S_ISDIR(self.d_identity[2])

              def children(self, fd):
                  self.parent_check()
                  names = sorted(os.listdir(fd))
                  assert len(names) + len(self.root_record[3]) <= 16384
                  result = {}
                  for name in names:
                      budget()
                      assert name and name not in ('.', '..') and '/' not in name
                      before = os.stat(name, dir_fd=fd, follow_symlinks=False)
                      row = {'identity': ident(before), 'target': None}
                      if stat.S_ISLNK(before.st_mode):
                          row['target'] = os.readlink(name, dir_fd=fd)
                          assert len(os.fsencode(row['target'])) <= 4096
                      assert ident(os.stat(name, dir_fd=fd, follow_symlinks=False)) == row['identity']
                      result[name] = row
                  self.parent_check()
                  assert sorted(os.listdir(fd)) == names
                  return result

              def view(self):
                  self.parent_check()
                  root_children = self.children(self.root_record[2])
                  d_children = self.children(self.d_fd)
                  assert len(root_children) + len(d_children) + len(self.root_record[3]) <= 16384
                  return {'d': self.d_identity.copy(), 'root_children': root_children, 'd_children': d_children,
                          'ancestors': {name: before.copy() for name, before, fd, edge, refs in self.root_record[3]},
                          'acl': {name: 'empty' for name in [*(part[0] for part in self.root_record[3]), str(V.parent)]}}

              def release_parent(self):
                  if self.d_fd is not None:
                      os.close(self.d_fd)
                      self.d_fd = None
                  if self.root_record is not None:
                      close_physical(self.root_record)
                      self.root_record = None

              def begin(self):
                  assert not os.path.lexists(cache / 'versions-mode-original.json')
                  assert not os.path.lexists(cache / 'provision-actions.jsonl')
                  self.open_parent()
                  initial = self.view()
                  assert not os.path.lexists(V) and not os.path.lexists(T)
                  mode = initial['d'][2]
                  assert not mode & 0o022 or mode == stat.S_IFDIR | 0o775
                  if mode == stat.S_IFDIR | 0o775:
                      self.baseline = dict(version=1, context=self.context, cache=self.cache_binding, **initial)
                      self.create_record('versions-mode-original.json', canonical(self.baseline))
                  self.create_record('provision-actions.jsonl', b'')
                  self.publish()
                  self.phase('supply', 'enter')
                  if self.baseline is not None:
                      self.mode_command('0755')
                  self.release_parent()

              def mode_command(self, mode):
                  assert mode in ('0755', '0775') and self.baseline is not None
                  self.load()
                  before = self.view()
                  expected_mode = 0o40775 if mode == '0755' else 0o40755
                  assert before['d'][2] == expected_mode
                  argv = ['/usr/bin/sudo', '-n', '/bin/chmod', mode, '/Library/Frameworks/Python.framework/Versions']
                  self.reserve(argv)
                  try:
                      bounded_command(argv, 0)
                  except BaseException:
                      observed = ident(os.fstat(self.d_fd))
                      self.complete(False, {'observed_d': observed})
                      print(canonical({'versions_mode': 'FAIL_UNKNOWN', 'actual_observed_d': observed}).decode('ascii'), file=sys.stderr)
                      raise
                  after = ident(os.fstat(self.d_fd))
                  assert after == ident(os.stat('Versions', dir_fd=self.root_record[2], follow_symlinks=False))
                  assert after[2] == stat.S_IFDIR | int(mode, 8)
                  assert all(after[index] == before['d'][index] for index in (0, 1, 3, 4, 5, 6, 7))
                  self.d_identity = after
                  actual = self.view()
                  original = before['root_children']
                  updated = dict(original, Versions={'identity': after, 'target': None})
                  assert actual['root_children'] == updated and actual['d_children'] == before['d_children']
                  assert actual['ancestors'] == before['ancestors']
                  self.complete(True, actual)

              def validated_history(self):
                  rows = self.load()
                  issued = {row['body']['number']: row['body']['argv'] for row in rows if row['kind'] == 'issued'}
                  results = {row['body']['number']: row['body'] for row in rows if row['kind'] == 'result'}
                  assert set(issued) == set(results) and all(row['known'] for row in results.values())
                  previous = None
                  for number, argv in issued.items():
                      result = results[number]
                      current = result['parents']
                      if current is None:
                          assert argv[0] != '/usr/bin/sudo'
                          continue
                      if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/chmod'] and argv[-1] == str(V.parent):
                          assert type(current) is dict and set(current) == {'d', 'ancestors', 'root_children', 'd_children', 'acl'}
                          before = self.baseline if previous is None else previous
                          assert all(current['d'][index] == before['d'][index] for index in (0, 1, 3, 4, 5, 6, 7))
                          assert current['d'][2] == (0o40755 if argv[3] == '0755' else 0o40775)
                          assert current['d_children'] == before['d_children'] and current['ancestors'] == before['ancestors']
                          assert current['root_children'] == dict(before['root_children'], Versions={'identity': current['d'], 'target': None})
                          assert current['acl'] == before['acl']
                          previous = current
                          continue
                      assert previous is not None or self.baseline is None
                      if self.baseline is not None:
                          assert type(current) is dict and set(current) == {str(ROOT), str(V.parent)}
                          for name, row in current.items():
                              assert type(row) is dict and set(row) == {'identity', 'children', 'original_names'}
                          allowed = set()
                          if argv[:3] == ['/usr/bin/sudo', '-n', '/bin/mkdir']:
                              allowed.add(str(Path(argv[5]).parent))
                          if argv[:4] == ['/usr/bin/sudo', '-n', '/bin/rm', '-d']:
                              allowed.update(str(Path(name).parent) for name in argv[5:] if Path(name) in TREES)
                          old_identities = {str(ROOT): previous['ancestors'][str(ROOT)], str(V.parent): previous['d']}
                          for name, old in old_identities.items():
                              value = current[name]['identity']
                              assert type(value) is list and len(value) == 9 and all(type(field) is int for field in value)
                              assert all(value[index] == old[index] for index in (0, 1, 2, 3, 4))
                              assert name in allowed or value == old
                              assert current[name]['original_names'] == sorted(self.baseline['root_children'] if name == str(ROOT) else self.baseline['d_children'])
                          assert current[str(V.parent)]['children'] == self.baseline['d_children']
                          assert current[str(ROOT)]['children'] == dict(self.baseline['root_children'], Versions={'identity': current[str(V.parent)]['identity'], 'target': None})
                          previous = {'d': current[str(V.parent)]['identity'],
                                      'root_children': current[str(ROOT)]['children'],
                                      'd_children': current[str(V.parent)]['children'], 'acl': previous['acl'],
                                      'ancestors': dict(previous['ancestors'], **{str(ROOT): current[str(ROOT)]['identity']})}
                  return previous

              @staticmethod
              def settled(outcome):
                  return (type(outcome['pid']) is int and outcome['pid'] > 0
                          and type(outcome['returncode']) is int and 0 <= outcome['returncode'] < 126
                          and outcome['reaped'] is True and outcome['cancelled'] is False
                          and outcome['privileged_unknown'] is False)

              def phase_quiescence(self):
                  rows = self.load()
                  entered = {row['body']['phase'] for row in rows
                             if row['kind'] == 'phase' and row['body']['point'] == 'enter'} - {'closure'}
                  completed = {row['body']['phase']: row['body'] for row in rows
                               if row['kind'] == 'phase' and row['body']['point'] == 'result'}
                  assert entered <= set(completed)
                  assert all(completed[name]['quiescent'] and self.settled(completed[name]['outcome']) for name in entered)

              def source_failure_settled(self):
                  if not self.settled(last_child_outcome) or last_child_outcome['returncode'] == 0:
                      return False
                  try:
                      self.validated_history()
                      assert not any(row['kind'] == 'issued' and row['body']['argv'][:3] ==
                                     ['/usr/bin/sudo', '-n', '/bin/mkdir'] for row in self.rows)
                      assert not os.path.lexists(V) and not os.path.lexists(T)
                  except (AssertionError, OSError, ValueError, KeyError):
                      return False
                  return True

              def restore(self):
                  self.phase_quiescence()
                  rows = self.rows
                  if self.baseline is None:
                      return
                  mode_issued = [row['body']['argv'] for row in rows if row['kind'] == 'issued'
                                 and row['body']['argv'][-1] == str(V.parent)]
                  if not mode_issued:
                      return
                  assert len(mode_issued) <= 2
                  expected = self.validated_history()
                  assert not os.path.lexists(V) and not os.path.lexists(T)
                  owned_results = [row['body'] for row in rows if row['kind'] == 'result' and row['body']['owned_sha256']]
                  if os.path.lexists(cache / 'owned.json'):
                      journal_identity, raw = journal_snapshot()
                      receipt = json.loads(raw, object_pairs_hook=self.unique)
                      assert canonical(receipt) == raw and not receipt['objects'] and not receipt['created']
                      if owned_results:
                          assert hashlib.sha256(raw).hexdigest() == owned_results[-1]['owned_sha256']
                          assert receipt['parents'] == owned_results[-1]['parents']
                      else:
                          assert not receipt['staging'] and hashlib.sha256(raw).hexdigest() == os.environ['YSTACK_RUNTIME_OWNED_SHA']
                          assert receipt['parents'][str(ROOT)]['identity'] == expected['ancestors'][str(ROOT)]
                          assert receipt['parents'][str(V.parent)]['identity'] == expected['d']
                  self.open_parent()
                  actual = self.view()
                  print(canonical({'versions_mode_recovery_observation': actual['d'],
                                   'matches_authenticated_state': actual == expected}).decode('ascii'), file=sys.stderr)
                  assert expected is not None and actual == expected
                  assert actual['d'][:2] == self.baseline['d'][:2]
                  assert all(actual['d'][index] == self.baseline['d'][index] for index in (0, 1, 3, 4))
                  root_children = dict(actual['root_children'], Versions=self.baseline['root_children']['Versions'])
                  assert root_children == self.baseline['root_children'] and actual['d_children'] == self.baseline['d_children']
                  for name, identity in self.baseline['ancestors'].items():
                      if name != str(ROOT):
                          assert actual['ancestors'][name] == identity
                  if len(mode_issued) == 2:
                      assert mode_issued[-1][3] == '0775' and actual['d'][2] == 0o40775
                      self.release_parent()
                      return
                  assert actual['d'][2] == 0o40755
                  self.mode_command('0775')
                  self.release_parent()


          def fixed_phase(name):
              global deadline, parent_mode
              assert name in VersionsParentMode.PHASES
              deadline = started + {'supply': 270, 'scope': 35 * 60, 'native': 50 * 60, 'closure': 270}[name]
              parent_mode = VersionsParentMode()
              try:
                  if name == 'supply':
                      parent_mode.begin()
                  else:
                      parent_mode.load()
                      rows = parent_mode.rows
                      completed = {row['body']['phase']: row['body'] for row in rows
                                   if row['kind'] == 'phase' and row['body']['point'] == 'result'}
                      if name != 'closure':
                          required = VersionsParentMode.PHASES[:VersionsParentMode.PHASES.index(name)]
                          assert all(key in completed and completed[key]['success'] and completed[key]['quiescent'] for key in required)
                      parent_mode.phase(name, 'enter')
                  if name == 'closure':
                      original = None
                      try:
                          parent_mode.phase_quiescence()
                          parent_mode.validated_history()
                          if os.path.lexists(cache / 'owned.json'):
                              rows = [row['body'] for row in parent_mode.rows if row['kind'] == 'result' and row['body']['owned_sha256']]
                              expected = os.environ['YSTACK_RUNTIME_OWNED_SHA']
                              assert re.fullmatch('[0-9a-f]{64}', expected)
                              if rows:
                                  assert rows[-1]['owned_sha256'] == expected
                              else:
                                  identity, raw = journal_snapshot()
                                  receipt = json.loads(raw, object_pairs_hook=parent_mode.unique)
                                  assert canonical(receipt) == raw and hashlib.sha256(raw).hexdigest() == expected
                                  assert not receipt['objects'] and not receipt['created'] and not receipt['staging']
                              cleanup()
                          else:
                              assert not os.path.lexists(V) and not os.path.lexists(T)
                      except BaseException as error:
                          original = error
                      close_all_physical()
                      try:
                          parent_mode.restore()
                      except BaseException as error:
                          if original is not None:
                              raise original from error
                          raise
                      if original is not None:
                          raise original
                      success = all(row['body']['success'] for row in parent_mode.rows
                                    if row['kind'] == 'phase' and row['body']['point'] == 'result')
                      parent_mode.phase(name, 'result', success, True)
                      assert success, 'earlier phase failure remains a failure'
                      return
                  script = cache / 'supply-phase.sh' if name == 'supply' else None
                  held_script = None
                  if script is not None:
                      held_script = os.open(script, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                      state = ident(os.fstat(held_script))
                      assert state == ident(script.lstat()) and stat.S_ISREG(state[2])
                      assert state[3] == os.getuid() and state[5] == 1 and state[6] <= 16 * 1024 * 1024
                  argv = ['/bin/bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', str(script)] if name == 'supply' else [
                      '/bin/bash', 'scripts/test/' + {'scope': 'scope-qualification.test.sh', 'native': 'shadow-enforced.test.sh'}[name]]
                  try:
                      bounded_command(argv, 0, True)
                      if held_script is not None:
                          assert ident(os.fstat(held_script)) == state == ident(script.lstat())
                  except BaseException:
                      parent_mode.load()
                      quiescent = name == 'supply' and parent_mode.source_failure_settled()
                      parent_mode.phase(name, 'result', False, quiescent)
                      raise
                  finally:
                      if held_script is not None:
                          os.close(held_script)
                  parent_mode.load()
                  parent_mode.phase(name, 'result', True, True)
              finally:
                  close_all_physical()
                  parent_mode.close()


          parent_mode = None
          if len(sys.argv) == 4 and sys.argv[2] == '--phase':
              fixed_phase(sys.argv[3])
              sys.exit(0)
          assert len(sys.argv) == 3 and sys.argv[2] == '--supply'
          parent_mode = VersionsParentMode()
          parent_mode.load()
          phase_rows = [row['body'] for row in parent_mode.rows if row['kind'] == 'phase']
          assert len(phase_rows) == 1 and phase_rows[0]['phase'] == 'supply' and phase_rows[0]['point'] == 'enter'
          deadline = phase_rows[0]['deadline']
          assert type(deadline) in (int, float) and math.isfinite(deadline) and uptime() < deadline <= started + 270
          parent_mode.validated_history()


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None


          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          received = 0
          requests = 0


          def fetch(url, expected_size, expected_sha, redirect=False):
              global received, requests
              budget()
              requests += 1
              assert requests <= 3
              request = urllib.request.Request(url, headers={'Accept-Encoding': 'identity'})
              try:
                  response = opener.open(request, timeout=max(0.01, deadline - uptime()))
              except urllib.error.HTTPError as response:
                  assert redirect and response.code == 302
                  assert len(response.headers.get_all('Location', [])) == 1
                  location = response.headers['Location']
                  parsed = urllib.parse.urlsplit(location)
                  assert parsed.scheme == 'https' and parsed.netloc == 'release-assets.githubusercontent.com'
                  assert parsed.path == '/github-production-release-asset/5101141/6387d980-de1f-11e8-9fee-7af0943ede86'
                  assert parsed.query and not parsed.fragment and len(location) <= 16384
                  response.close()
                  return fetch(location, expected_size, expected_sha)
              with response:
                  assert response.status == 200 and not redirect
                  assert response.headers.get('Content-Encoding', 'identity') == 'identity'
                  assert int(response.headers['Content-Length']) == expected_size
                  data = bytearray()
                  while True:
                      budget()
                      block = response.read(min(65536, expected_size + 1 - len(data)))
                      if not block:
                          break
                      data.extend(block)
                      received += len(block)
                      assert len(data) <= expected_size and received <= 280 * 1024 * 1024
              assert len(data) == expected_size and hashlib.sha256(data).hexdigest() == expected_sha
              return bytes(data)


          def inflate(data, cap, gzip_format=False):
              decoder = zlib.decompressobj(31 if gzip_format else 15)
              output = decoder.decompress(data, cap + 1)
              assert len(output) <= cap and decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
              return output


          expanded_bytes = 0


          def parse_pkg(raw):
              global expanded_bytes
              assert len(raw) == 89032014 and hashlib.sha256(raw).hexdigest() == PKG_SHA
              magic, header, version, compressed, size, algorithm = struct.unpack('>4sHHQQI', raw[:28])
              assert (magic, header, version, compressed, size, algorithm) == (b'xar!', 28, 1, 6790, 33710, 1)
              toc_compressed = raw[header:header + compressed]
              toc = inflate(toc_compressed, size)
              assert len(toc) == size and hashlib.sha256(toc).hexdigest() == TOC_SHA
              base = header + compressed
              assert hashlib.sha1(toc_compressed).digest() == raw[base:base + 20]
              tree = ET.fromstring(toc)
              files = {}
              total = 0
              def walk(parent, prefix=''):
                  nonlocal total
                  for entry in parent.findall('file'):
                      name = entry.findtext('name')
                      assert name and name not in ('.', '..') and '/' not in name and '\x00' not in name
                      path = prefix + name
                      assert path not in files and len(files) < 16384
                      kind = entry.findtext('type')
                      files[path] = None
                      if kind == 'directory':
                          walk(entry, path + '/')
                          continue
                      assert kind == 'file'
                      data = entry.find('data')
                      offset, length, expected = [int(data.findtext(key)) for key in ('offset', 'length', 'size')]
                      assert 0 <= offset <= len(raw) and 0 <= length <= 256 * 1024 * 1024 and expected <= 256 * 1024 * 1024
                      archived = raw[base + offset:base + offset + length]
                      assert len(archived) == length
                      encoding = data.find('encoding').get('style')
                      extracted = inflate(archived, expected) if encoding == 'application/x-gzip' else archived
                      assert encoding in ('application/x-gzip', 'application/octet-stream') and len(extracted) == expected
                      for tag, blob in (('archived-checksum', archived), ('extracted-checksum', extracted)):
                          checksum = data.find(tag)
                          assert checksum is not None and checksum.get('style') == 'sha1'
                          assert hashlib.sha1(blob).hexdigest() == checksum.text
                      total += len(extracted)
                      assert total <= 512 * 1024 * 1024
                      files[path] = extracted
              walk(tree.find('toc'))
              assert len(files) == 36 and sum(value is not None for value in files.values()) == 28
              certs = tree.findall('.//{http://www.w3.org/2000/09/xmldsig#}X509Certificate')[:3]
              assert len(certs) == 3
              cert_shas = ['5dbaf27e6e8a6dda57a129491fd69a183ca8b0d4a8f895946d569db534d45d3b',
                           'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a',
                           'b0b1730ecbc7ff4505142c49f1295e6eda6bcaed7e2c68c5be91b5a11001f024']
              for index, (cert, digest) in enumerate(zip(certs, cert_shas)):
                  value = base64.b64decode(cert.text)
                  assert hashlib.sha256(value).hexdigest() == digest
                  (cache / ('cert-%s.der' % index)).write_bytes(value)
              (cache / 'toc.bin').write_bytes(toc_compressed)
              signature = tree.find('toc/signature')
              assert signature.get('style') == 'RSA'
              offset, count = int(signature.findtext('offset')), int(signature.findtext('size'))
              assert (offset, count) == (20, 256)
              (cache / 'signature.bin').write_bytes(raw[base + offset:base + offset + count])
              public = run(['/usr/bin/openssl', 'x509', '-inform', 'DER', '-in', str(cache / 'cert-0.der'), '-pubkey', '-noout'])
              (cache / 'public.pem').write_bytes(public)
              run(['/usr/bin/openssl', 'dgst', '-sha1', '-verify', str(cache / 'public.pem'), '-signature',
                   str(cache / 'signature.bin'), str(cache / 'toc.bin')])
              run(['/usr/bin/security', 'verify-cert', '-L', '-R', 'offline', '-N', '-p', 'basic',
                   '-c', str(cache / 'cert-0.der'), '-c', str(cache / 'cert-1.der')])
              expanded_bytes = total
              return files['Python_Framework.pkg/Payload']


          def parse_cpio(payload):
              raw = inflate(payload, 512 * 1024 * 1024, True)
              assert expanded_bytes + len(raw) <= 512 * 1024 * 1024
              rows, blobs, offset, total = [], {}, 0, 0
              while True:
                  budget()
                  assert raw[offset:offset + 6] == b'070707' and offset + 76 <= len(raw)
                  values = [int(raw[offset + start:offset + end], 8) for start, end in
                            ((6,12),(12,18),(18,24),(24,30),(30,36),(36,42),(42,48),(48,59),(59,65),(65,76))]
                  dev, ino, mode, uid, gid, nlink, rdev, mtime, namesize, filesize = values
                  offset += 76
                  assert 0 < namesize <= 4096 and filesize <= 16 * 1024 * 1024
                  name_raw = raw[offset:offset + namesize]
                  assert len(name_raw) == namesize and name_raw[-1:] == b'\x00' and b'\x00' not in name_raw[:-1]
                  name = name_raw[:-1].decode('utf8')
                  offset += namesize
                  body = raw[offset:offset + filesize]
                  assert len(body) == filesize
                  offset += filesize
                  if name == 'TRAILER!!!':
                      assert filesize == 0 and not any(raw[offset:])
                      break
                  assert name == '.' or name.startswith('./')
                  path = name[2:] if name != '.' else ''
                  assert len(path.split('/')) <= 128 and not any(part in ('', '.', '..') for part in path.split('/')) if path else True
                  assert path not in blobs and len(rows) < 16384
                  kind = stat.S_IFMT(mode)
                  assert kind in (stat.S_IFDIR, stat.S_IFREG, stat.S_IFLNK)
                  assert uid == gid == 0 and rdev == 0
                  row = {'path': path, 'kind': kind, 'mode': mode, 'uid': uid, 'gid': gid, 'nlink': nlink, 'size': filesize}
                  if kind == stat.S_IFREG:
                      assert nlink == 1
                      row['sha256'] = hashlib.sha256(body).hexdigest()
                      total += filesize
                  elif kind == stat.S_IFLNK:
                      assert nlink == 1
                      target = body.decode('utf8')
                      assert target and not target.startswith('/') and '\x00' not in target
                      resolved = os.path.normpath(os.path.join(os.path.dirname(path), target))
                      assert resolved != '..' and not resolved.startswith('../')
                      row['link'] = target
                  else:
                      assert filesize == 0
                  rows.append(row)
                  blobs[path] = body
              assert len(rows) == 4502 and total == 131786038
              assert sum(row['kind'] == stat.S_IFREG for row in rows) == 3934
              assert sum(row['kind'] == stat.S_IFLNK for row in rows) == 39
              assert sum(row['kind'] == stat.S_IFDIR for row in rows) == 529
              assert hashlib.sha256(canonical(rows)).hexdigest() == MANIFEST_SHA
              byname = {row['path']: row for row in rows}
              dangling = set()
              for row in rows:
                  if row['kind'] != stat.S_IFLNK:
                      continue
                  pending, resolved = row['path'].split('/'), []
                  for _ in range(128):
                      budget()
                      if not pending:
                          break
                      resolved.append(pending.pop(0))
                      name = '/'.join(resolved)
                      if name not in byname:
                          dangling.add(row['path'])
                          break
