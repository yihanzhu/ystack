          test "$(/usr/bin/shasum -a 256 "$YSTACK_PROOF_TMP/provision.py" | /usr/bin/awk '{print $1}')" = 9d3ee653838e91fce78fdca6e28f8e5fd8b23f01983fd97d022698286c5525c0
          /usr/bin/python3 -I -S -B "$YSTACK_PROOF_TMP/provision.py" "$YSTACK_PROOF_TMP" --phase native
      - name: Verify source and remove only the owned runtime and test cache
        if: always()
        timeout-minutes: 5
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          recovery_status=0
          if [ -n "${YSTACK_PROOF_TMP:-}" ]; then
            if test -d "$YSTACK_PROOF_TMP" && test ! -L "$YSTACK_PROOF_TMP" &&
               test "$(/usr/bin/stat -f '%d:%i:%u' "$YSTACK_PROOF_TMP")" = "$YSTACK_PROOF_TMP_ID" &&
               test "$(/usr/bin/shasum -a 256 "$YSTACK_PROOF_TMP/provision.py" | /usr/bin/awk '{print $1}')" = 9d3ee653838e91fce78fdca6e28f8e5fd8b23f01983fd97d022698286c5525c0; then
              /usr/bin/python3 -I -S -B "$YSTACK_PROOF_TMP/provision.py" "$YSTACK_PROOF_TMP" --phase closure || recovery_status=$?
            else
              recovery_status=1
            fi
            if [ "$recovery_status" -eq 0 ]; then
              if test -d "$YSTACK_PROOF_TMP" && test ! -L "$YSTACK_PROOF_TMP" &&
                 test "$(/usr/bin/stat -f '%d:%i:%u' "$YSTACK_PROOF_TMP")" = "$YSTACK_PROOF_TMP_ID"; then
                /bin/rm -rf -- "$YSTACK_PROOF_TMP" || recovery_status=$?
                test ! -e "$YSTACK_PROOF_TMP" || recovery_status=1
                test ! -L "$YSTACK_PROOF_TMP" || recovery_status=1
              else
                recovery_status=1
              fi
            fi
          fi
          [[ "$YSTACK_SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$YSTACK_SELECTED_SHA" = "$GITHUB_SHA"
          test "$YSTACK_WORKFLOW_SHA" = "$YSTACK_SELECTED_SHA"
          test "$(/usr/bin/git rev-parse HEAD)" = "$YSTACK_SELECTED_SHA"
          workflow_blob=$(/usr/bin/git rev-parse "$YSTACK_WORKFLOW_SHA:.github/workflows/scope-genuine-macos.yml")
          test "$(/usr/bin/git hash-object .github/workflows/scope-genuine-macos.yml)" = "$workflow_blob"
          /usr/bin/printf 'selected_sha=%s workflow_sha=%s workflow_blob=%s\n' "$YSTACK_SELECTED_SHA" "$YSTACK_WORKFLOW_SHA" "$workflow_blob"
          test -z "$(/usr/bin/git status --porcelain=v1)"
          test "${recovery_status:-0}" -eq 0
